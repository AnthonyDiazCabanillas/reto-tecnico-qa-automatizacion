name: CI - Automatización QA

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    # Lunes a viernes 7:00 a. m. hora de Lima (12:00 UTC)
    - cron: "0 12 * * 1-5"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  karate:
    name: API · Karate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: karateNttdataDemo
    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Instalar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: karateNttdataDemo/pom.xml

      - name: Ejecutar pruebas de API
        run: mvn -B clean test -Dkarate.env=dev

      - name: Resumen de resultados
        if: always()
        run: node ../scripts/ci/resumen-karate.js >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-karate
          path: |
            karateNttdataDemo/target/karate-reports
            karateNttdataDemo/target/cucumber-html-reports
          if-no-files-found: warn
          retention-days: 14

  playwright:
    name: UI · Playwright (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Imagen oficial de Playwright con la MISMA versión del proyecto (1.45.3):
    # trae los 3 navegadores y todas sus dependencias, sin depender de la versión de Ubuntu del runner
    container:
      image: mcr.microsoft.com/playwright:v1.45.3-jammy
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chrome
            script: test-dev
          - browser: firefox
            script: test-firefox
          - browser: webkit
            script: test-webkit
    defaults:
      run:
        working-directory: playwright-pacifico
    env:
      HEADLESS: "true"
      # Firefox exige HOME=/root cuando corre como root dentro del contenedor
      HOME: /root
    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar pruebas UI
        run: npm run ${{ matrix.script }}

      - name: Generar reportes (si hubo fallos)
        if: failure()
        continue-on-error: true
        run: npm run reportes
        env:
          ENV: dev
          BROWSER: ${{ matrix.browser }}

      - name: Resumen de resultados
        if: always()
        run: node ../scripts/ci/resumen-playwright.js "${{ matrix.browser }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar reportes, PDF de evidencias y traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-playwright-${{ matrix.browser }}
          path: |
            playwright-pacifico/test-results
            playwright-pacifico/allure-results
          if-no-files-found: warn
          retention-days: 14
